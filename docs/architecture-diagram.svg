    <rect x="30" y="72" width="170" height="12" fill="#6b7280"/>
    <text x="115" y="76" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600" letter-spacing="1">SOURCE</text>
    <text x="115" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">IQVIA + Veeva</text>
    <text x="115" y="132" text-anchor="middle" font-size="10.5" fill="#4b5563">Rx transactions,</text>
    <text x="115" y="147" text-anchor="middle" font-size="10.5" fill="#4b5563">HCP call activity,</text>
    <text x="115" y="162" text-anchor="middle" font-size="10.5" fill="#4b5563">customer master</text>
    <text x="115" y="182" text-anchor="middle" font-size="10" fill="#9ca3af">CSV files → S3</text>
  </g>

  <path d="M200 135 L228 135" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAKE -->
  <g>
    <rect x="230" y="60" width="150" height="150" rx="6" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5"/>
    <rect x="230" y="60" width="150" height="24" rx="6" fill="#d97706"/>
