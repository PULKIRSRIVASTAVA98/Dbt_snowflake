<svg viewBox="0 0 1320 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">

  <rect width="1320" height="760" fill="#ffffff"/>

  <!-- ===================== ROW 1: MAIN PIPELINE ===================== -->

  <!-- SOURCE -->
  <g>
    <rect x="30" y="60" width="170" height="150" rx="6" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5"/>
