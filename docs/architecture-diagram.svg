    <text x="795" y="497" text-anchor="middle" font-size="9.5" fill="#4b5563">dw → test</text>
    <text x="795" y="512" text-anchor="middle" font-size="9.5" fill="#4b5563">tag:dw</text>

    <path d="M870 495 L898 495" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

