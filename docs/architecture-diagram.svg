    <text x="305" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Amazon S3</text>
    <text x="305" y="132" text-anchor="middle" font-size="10.5" fill="#4b5563">raw landing zone</text>
    <text x="305" y="150" text-anchor="middle" font-size="10.5" fill="#4b5563">IQVIA_STG /</text>
    <text x="305" y="165" text-anchor="middle" font-size="10.5" fill="#4b5563">VEEVA_STG paths</text>
    <text x="305" y="185" text-anchor="middle" font-size="10" fill="#9ca3af">COPY INTO source</text>
  </g>

  <path d="M380 135 L408 135" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

